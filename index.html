<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<style>
body{
    font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
    margin:0;
    padding:20px;
    background:#f5f7fa;
    text-align:center;
    color:#333;
}

.card{
    max-width:700px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

.photo{
    width:250px;
    height:250px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #1976d2;
}

.name{
    font-size:42px;
    font-weight:bold;
    margin-top:20px;
    color:#0d47a1;
}

.affiliation{
    font-size:28px;
    margin-top:15px;
    line-height:1.6;
}

.title{
    font-size:28px;
    margin-top:10px;
    color:#555;
}

.contact{
    font-size:26px;
    margin-top:15px;
    line-height:1.8;
}

.qrcode{
    width:280px;
    max-width:90%;
    margin-top:25px;
}

.btn{
    display:block;
    width:90%;
    max-width:500px;
    margin:18px auto;
    padding:18px;
    font-size:26px;
    font-weight:bold;
    text-decoration:none;
    border-radius:12px;
    color:white;
    transition:.3s;
    box-sizing:border-box;
}

.contact-btn{
    background:#1976d2;
}

.line-btn{
    background:#06c755;
}

.vcf-btn{
    background:#ff9800;
}

.btn:hover{
    opacity:0.9;
}

.footer{
    margin-top:25px;
    font-size:20px;
    color:#777;
}

@media (max-width:768px){

    .photo{
        width:200px;
        height:200px;
    }

    .name{
        font-size:36px;
    }

    .affiliation{
        font-size:24px;
    }

    .title{
        font-size:24px;
    }

    .contact{
        font-size:22px;
    }

    .btn{
        font-size:22px;
    }
}
</style>

</head>
<body>

<div class="card">

<img src="photo.jpg" class="photo" alt="張勝雄">

<div class="name">

</div>

<div class="affiliation">
淡江大學運輸管理學系
</div>

<div class="contact">
